<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Biblioteca</title>
</head>
<body>
    <div class="cabecario">
        <h1>Biblioteca do saber!!!</h1>
    </div>
    
    <div class="box">
        <h2>Gerenciar a Biblioteca do saber</h2>
        <p class="frase">Utilize as ações abaixo para os livros cadastrados</p>
        <p class="verde">CADASTRO</p>
        <button class="escura" onclick=" cadastrarLivro()">+ Cadastrar novo livro </button>
        <p class="verde">CONSULTAS</p>
        <button onclick="quantidade()">Quantidades de livros</button> <br>
        <button onclick="mostrar()">Listas todos os livros</button>
        <p class="verde">REMOÇÃO</p>
        <button onclick="removerUltimo()">Remover o último livro</button> <br>
        <button onclick="limparTudo()">Limpar biblioteca</button>
    
    </div>
 
</body>

<script src="script.js"></script>

</html>
